name: Daily site

# Refresh the dashboard's numbers every day and publish it (plan Section 11, Phase 7).
#
# The archives this project reads publish daily, so "live" here means daily, not real-time.
# The RPKI side is cheap. The BGP side is the constraint: the six-collector study is 818 MB
# and an hour, which is not a daily job for a hosted runner. One collector is - rrc06, the
# smallest at about 43 MB, the same one `bgpshield reproduce` uses - so that is what the site
# refreshes from, and the site says so on every page rather than implying the study's scope.
#
# Runs after the daily RPKI job so the two never race to commit web/public/data. Everything
# under data/ is gitignored and lives only for the run; only the small JSON the site reads
# is committed, inside the 5 MB budget the plan sets.

on:
  workflow_run:
    workflows: ["Daily RPKI snapshot"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Routing snapshot date to ingest (YYYY-MM-DD). Defaults to yesterday UTC."
        required: false
        type: string
      collector:
        description: "Collector to ingest."
        required: false
        default: rrc06
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-site
  cancel-in-progress: false

jobs:
  refresh:
    # A manual run always goes ahead; a chained run only if the RPKI job succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (locked)
        run: uv sync --locked

      # Inputs reach the shell through the environment, never by interpolation, so a
      # crafted value cannot become a command. Both are checked before anything uses them.
      - name: Choose the snapshot
        id: pick
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          REQUESTED_COLLECTOR: ${{ inputs.collector }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            day="$REQUESTED_DATE"
          else
            day="$(date -u -d yesterday +%F)"
          fi
          if ! date -u -d "$day" +%F >/dev/null 2>&1 || [ "$(date -u -d "$day" +%F)" != "$day" ]; then
            echo "date must be YYYY-MM-DD, got '$day'" >&2
            exit 1
          fi
          collector="${REQUESTED_COLLECTOR:-rrc06}"
          case "$collector" in
            *[!A-Za-z0-9.-]*|"") echo "collector name '$collector' is not valid" >&2; exit 1 ;;
          esac
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "collector=$collector" >> "$GITHUB_OUTPUT"
          # "$day -1 month" overflows: 2026-03-31 minus a month is February 31, which GNU
          # date normalises to March 3, so the job would ask for the SAME month's topology
          # and then fail in `validate`, which correctly wants the month before. Stepping
          # back one day from the first of the month cannot overflow. This matches
          # `bgpshield.tables.previous_month`, and plan Section 10.4 requires the month
          # before so the topology is not inferred from the routes being judged.
          first_of_month="$(date -u -d "$day" +%Y-%m-01)"
          echo "month=$(date -u -d "$first_of_month -1 day" +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          # Where Pages will serve the site, for the sitemap and social previews. A custom
          # domain can override it with a repository variable named SITE_URL.
          echo "url=https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io/$REPO" >> "$GITHUB_OUTPUT"

      # The delegated-stats files and the month's CAIDA data change slowly; keep them for a
      # week so the archives are not asked for the same files every day (plan Section 16).
      - name: Cache slow-moving inputs
        uses: actions/cache@v4
        with:
          path: |
            data/raw/delegated
            data/raw/caida
          key: inputs-${{ runner.os }}-${{ steps.pick.outputs.week }}
          restore-keys: |
            inputs-${{ runner.os }}-

      - name: RPKI snapshot
        run: uv run bgpshield ingest-rpki --date "${{ steps.pick.outputs.day }}"

      - name: Topology for the month before
        run: uv run bgpshield ingest-meta --month "${{ steps.pick.outputs.month }}"

      - name: One collector's routing table
        run: uv run bgpshield ingest-bgp --date "${{ steps.pick.outputs.day }}" --collectors "${{ steps.pick.outputs.collector }}"

      - name: Validate and detect
        run: |
          uv run bgpshield validate --date "${{ steps.pick.outputs.day }}" --collectors "${{ steps.pick.outputs.collector }}"
          uv run bgpshield detect --date "${{ steps.pick.outputs.day }}" --collectors "${{ steps.pick.outputs.collector }}"

      - name: Export the dashboard data
        run: |
          uv run bgpshield adoption --export web/public/data/aspa_adoption.json
          uv run bgpshield export

      - name: Commit the data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          if git diff --quiet -- web/public/data; then
            echo "no change to publish"
          else
            git add web/public/data
            git commit -m "chore(data): dashboard through ${{ steps.pick.outputs.day }} (${{ steps.pick.outputs.collector }})"
            git push origin HEAD:main
          fi

      # A project site is served from /<repo>, so the base path comes from the repository
      # name rather than being typed in. Nothing else in the build depends on where it lives.
      - name: Build the site
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || steps.pick.outputs.url }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
