[project]
name = "hijax"
version = "0.0.1"
description = "Hijax: measuring BGP route-security (RPKI ROV + ASPA) adoption and impact"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Tanishka Jangir", email = "tanishkajangir26@gmail.com" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pybgpkit>=0.8",
    "requests>=2.32",
    "tzdata>=2026.4",
    "py-radix>=1.1.0",
    "matplotlib>=3.11.2",
]

[project.scripts]
hijax = "hijax.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hijax"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["bgpkit", "bgpkit.*", "pybgpkit", "duckdb", "pyarrow", "pyarrow.*", "radix"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
